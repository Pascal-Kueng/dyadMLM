url: https://pascal-kueng.github.io/dyadMLM/

# Match the six-panel reference figures to the 10-by-6.5-inch vignette figures.
figures:
  fig.width: 10
  fig.asp: 0.65

home:
  title: "dyadMLM: Tools for Dyadic Multilevel Models"
  description: "Prepare and analyze distinguishable and exchangeable dyadic data for APIM, DIM, and DSM multilevel models in R."

authors:
  Pascal Küng:
    href: https://pascalkueng.com/

template:
  bootstrap: 5
  light-switch: true
  opengraph:
    image:
      src: social-preview.png
      alt: "dyadMLM R package: tools for dyadic multilevel models for distinguishable and exchangeable dyads"

navbar:
  structure:
    left: [reference, articles, workshop, news]
    right: [search, github, lightswitch]
  components:
    reference:
      text: Functions
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Actor-Partner Interdependence Model
        href: articles/apim.html
      - text: Dyad-Individual Model
        href: articles/dim.html
      - text: Dyadic Score Model
        href: articles/dsm.html
    workshop:
      text: Workshop
      href: workshop/
    github:
      icon: fa-github
      href: https://github.com/Pascal-Kueng/dyadMLM
      aria-label: GitHub

articles:
- title: Start here
  desc: Core data requirements and the main preparation workflow.
  contents:
  - getting-started
- title: Model-specific preparation
  desc: Details for specific dyadic model parameterizations.
  contents:
  - apim
  - dim
  - dsm

reference:
- title: Main functions
  contents:
  - prepare_dyad_data
  - compare_nested_models
  - recover_exchangeable_covariance

- title: Predictive diagnostics
  desc: Experimental descriptive checks of how well a fitted model reproduces partner dependence.
  contents:
  - simulate_dyad_responses
  - check_partner_dependence

- title: Example data
  contents:
  - dyads_cross
  - dyads_ild
  - dyads_nbinom_cross
  - dyads_nbinom_ild
