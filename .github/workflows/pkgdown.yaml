# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether workshop materials changed
        id: workshop-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          rebuild=true
          # Paths that directly define the published workshop outputs.
          workshop_paths=(
            dev/workshop
            vignettes/diagram-helpers.Rinc
            vignettes/dim-grid.Rinc
            vignettes/references.bib
            pkgdown/templates/content-workshop.html
            _pkgdown.yml
            .github/scripts/export-workshop-slides.sh
            .github/workflows/pkgdown.yaml
          )

          if [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- \
              "${workshop_paths[@]}"; then
              rebuild=false
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git diff --quiet "$BASE_SHA...$PR_HEAD_SHA" -- \
              "${workshop_paths[@]}"; then
              rebuild=false
            fi
          fi

          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::DHARMa
            any::digest
            any::ggplot2
            any::gridExtra
            any::modelbased
            any::parameters
            any::patchwork
            any::pkgdown
            any::report
            any::RSA
            any::see
            any::tidyr
            any::wbCorr
            local::.
          needs: website

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render all workshop materials
        if: steps.workshop-changes.outputs.rebuild == 'true'
        run: |
          quarto render dev/workshop/dyad-day.qmd
          quarto render dev/workshop/applied-tutorial.qmd

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Export workshop slides to PDF
        if: steps.workshop-changes.outputs.rebuild == 'true'
        run: bash .github/scripts/export-workshop-slides.sh

      - name: Add workshop materials
        if: steps.workshop-changes.outputs.rebuild == 'true'
        run: |
          mkdir -p docs/workshop/conceptual docs/workshop/applied
          Rscript -e 'pkgdown::render_page(".", "workshop", data = list(pagetitle = "Workshop", description = "Dyadic Data Analysis workshop materials."), path = "workshop/index.html", depth = 1)'
          cp dev/workshop/dyad-day.html docs/workshop/conceptual/index.html
          cp dev/workshop/applied-tutorial.html docs/workshop/applied/index.html
          cp dev/workshop/03_exercises_cross_sectional.Rmd docs/workshop/03_exercises_cross_sectional.Rmd
          cp dev/workshop/04_exercises_ild.Rmd docs/workshop/04_exercises_ild.Rmd
          zip -jq docs/workshop/dyadic-data-analysis-workshop.zip \
            dev/workshop/00_setup.R \
            docs/workshop/01_conceptual_foundations.pdf \
            docs/workshop/02_applied_tutorial.pdf \
            dev/workshop/03_exercises_cross_sectional.Rmd \
            dev/workshop/04_exercises_ild.Rmd \
            dev/workshop/dyadic-data.rds \
            dev/workshop/dyadic-ild-exercise.rds \
            dev/workshop/dyadic-person-means.rds \
            dev/workshop/helpers.R \
            dev/workshop/hints.R

      - name: Preserve previously published workshop materials
        if: >-
          steps.workshop-changes.outputs.rebuild != 'true' &&
          github.event_name != 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          git archive --format=tar \
            --output=/tmp/dyadmlm-published-workshop.tar \
            FETCH_HEAD workshop
          tar -xf /tmp/dyadmlm-published-workshop.tar -C docs

      - name: Validate staged workshop materials
        if: github.event_name != 'pull_request' || steps.workshop-changes.outputs.rebuild == 'true'
        shell: bash
        run: |
          workshop_files=(
            docs/workshop/index.html
            docs/workshop/conceptual/index.html
            docs/workshop/applied/index.html
            docs/workshop/01_conceptual_foundations.pdf
            docs/workshop/02_applied_tutorial.pdf
            docs/workshop/03_exercises_cross_sectional.Rmd
            docs/workshop/04_exercises_ild.Rmd
            docs/workshop/dyadic-data-analysis-workshop.zip
          )

          for workshop_file in "${workshop_files[@]}"; do
            test -s "$workshop_file"
          done

          unzip -tq docs/workshop/dyadic-data-analysis-workshop.zip

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
