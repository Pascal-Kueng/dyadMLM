name: Signal Zenodo release

on:
  release:
    types: [published]

# This tag-associated workflow receives neither repository permissions nor secrets.
permissions: {}

jobs:
  signal:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Hand release to the trusted default-branch workflow
        run: echo "Stable release event received."
