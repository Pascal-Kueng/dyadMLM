name: Publish Zenodo release

on:
  workflow_run:
    workflows: [Signal Zenodo release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub Release tag, for an idempotent retry
        required: true
        type: string
  pull_request:
    paths:
      - .github/scripts/publish_zenodo_release.py
      - .github/scripts/test_publish_zenodo_release.py
      - .github/workflows/zenodo-release.yaml
      - .github/workflows/zenodo-release-signal.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Test release safeguards
        run: >-
          python3 -m unittest discover
          -s .github/scripts
          -p 'test_publish_zenodo_release.py'
          -v

  publish:
    needs: test
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: zenodo-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # workflow_run and allowed manual runs both use trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Publish the CRAN tarball to the existing Zenodo concept
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          ZENODO_API_TOKEN: ${{ secrets.ZENODO_API_TOKEN }}
        run: python3 .github/scripts/publish_zenodo_release.py "$RELEASE_TAG"
